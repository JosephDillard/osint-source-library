name: Catalog checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate source catalog
        run: python tools/catalog.py validate
      - name: Check generated library
        run: python tools/catalog.py build --check
      - name: Validate city coverage and source references
        run: python tools/cities.py validate
      - name: Check generated city pages
        run: python tools/cities.py build --check
      - name: Check catalog validation behavior
        run: python -m unittest discover -s tests
